<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>传染病暴发调查与接触网络</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 820px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>传染病暴发调查与接触网络</h1>
  <p>这是最小演示页面。使用浏览器或 curl 调用 JSON API。</p>
  <p><button onclick="checkHealth()">检查服务状态</button></p>
  <pre id="result">等待操作</pre>
  <h2>值班页</h2>
  <p>
    <input id="owner" placeholder="负责人 ID（留空查看全部）">
    <button onclick="loadDuty()">查询值班情况</button>
  </p>
  <pre id="duty">—</pre>
  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions
POST /api/venues/&lt;id&gt;/attendees
GET  /api/venues/&lt;id&gt;/attendees
GET  /api/duty?owner_id=&lt;负责人&gt;</pre>
</main>
<script>
async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}
async function loadDuty() {
  const owner = document.getElementById('owner').value.trim();
  const url = owner ? '/api/duty?owner_id=' + encodeURIComponent(owner) : '/api/duty';
  const response = await fetch(url);
  document.getElementById('duty').textContent = JSON.stringify(await response.json(), null, 2);
}
</script>
</body>
</html>
