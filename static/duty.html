<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随访值班看板</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    h1 { font-size: 1.4rem; }
    .bar { display: flex; gap: .6rem; align-items: center; margin: 1rem 0 1.5rem; }
    input, button, select { padding: .45rem .7rem; font-size: .95rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }
    th, td { border: 1px solid #e5e7eb; padding: .5rem .7rem; text-align: left; font-size: .92rem; }
    th { background: #f9fafb; }
    .overdue { color: #b91c1c; font-weight: 600; }
    .tag { display: inline-block; padding: .1rem .45rem; border-radius: 999px; background: #fee2e2; color: #b91c1c; font-size: .8rem; }
    .muted { color: #6b7280; }
    a { color: #2563eb; }
  </style>
</head>
<body>
<main>
  <h1>随访值班看板</h1>
  <p class="muted">按负责人筛选，查看各场所未完成随访数与逾期名单。数据来自 <code>GET /api/duty</code>。</p>
  <div class="bar">
    <label for="owner">负责人</label>
    <input id="owner" placeholder="如 investigator-7，留空显示全部">
    <button onclick="load()">刷新</button>
    <span id="asof" class="muted"></span>
  </div>

  <h2>场所未完成数</h2>
  <table id="venueTable">
    <thead><tr><th>场所</th><th>未完成随访</th><th>其中逾期</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>逾期名单</h2>
  <table id="overdueTable">
    <thead><tr><th>接触者</th><th>负责人</th><th>场所</th><th>到期日</th><th>来源病例</th></tr></thead>
    <tbody></tbody>
  </table>
</main>
<script>
function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch];
  });
}

async function load() {
  const owner = document.getElementById("owner").value.trim();
  const params = new URLSearchParams();
  if (owner) params.set("owner", owner);
  const response = await fetch("/api/duty" + (params.toString() ? "?" + params : ""));
  const payload = await response.json();
  document.getElementById("asof").textContent = "统计时点：" + (payload.as_of || "");

  const venueBody = document.querySelector("#venueTable tbody");
  if (!payload.venues || payload.venues.length === 0) {
    venueBody.innerHTML = '<tr><td colspan="3" class="muted">暂无场所数据</td></tr>';
  } else {
    venueBody.innerHTML = payload.venues.map(function (venue) {
      const overdue = venue.overdue.length;
      return "<tr><td>" + esc(venue.venue) + "</td><td>" + venue.open_count +
        "</td><td>" + (overdue > 0 ? '<span class="tag">' + overdue + "</span>" : "0") +
        "</td></tr>";
    }).join("");
  }

  const overdueBody = document.querySelector("#overdueTable tbody");
  if (!payload.overdue || payload.overdue.length === 0) {
    overdueBody.innerHTML = '<tr><td colspan="5" class="muted">没有逾期随访</td></tr>';
  } else {
    overdueBody.innerHTML = payload.overdue.map(function (item) {
      const closedTag = item.case_closed
        ? ' <span class="tag" title="病例已关闭，仅可查看">病例已关闭</span>'
        : "";
      return "<tr><td>" + esc(item.person_id) + "</td><td>" + esc(item.owner) +
        "</td><td>" + esc(item.venue) +
        '</td><td class="overdue">' + esc(item.due_at) +
        '</td><td>' + esc(item.case_id) + closedTag + "</td></tr>";
    }).join("");
  }
}

document.getElementById("owner").addEventListener("keydown", function (event) {
  if (event.key === "Enter") load();
});
load();
</script>
</body>
</html>
